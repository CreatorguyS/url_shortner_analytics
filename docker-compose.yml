version: "3.9"

# ─── Shared Network ────────────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mongo-primary-data:
  mongo-secondary1-data:
  mongo-secondary2-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  nginx-certs:

# ─── Common service template ───────────────────────────────────────────────────
x-common-env: &common-env
  NODE_ENV: production
  MONGO_URI: mongodb://mongo-primary:27017/url-shortener?replicaSet=rs0
  MONGO_URI_SECONDARY: mongodb://mongo-secondary-1:27017,mongo-secondary-2:27017/url-shortener?replicaSet=rs0&readPreference=secondaryPreferred
  REDIS_CLUSTER_NODES: redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
  REDIS_HOST: redis-node-1
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis-node-1:6379
  URL_ENCRYPTION_KEY: ${URL_ENCRYPTION_KEY}
  JWT_SECRET: ${JWT_SECRET}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret-change-me}
  NUM_SHARDS: "3"
  BASE_URL: ${BASE_URL:-https://localhost}
  # Service URLs (internal)
  URL_SERVICE_URL:       http://url-service:3001
  REDIRECT_SERVICE_URL:  http://redirect-service:3002
  ANALYTICS_SERVICE_URL: http://analytics-service:3003
  AUTH_SERVICE_URL:      http://auth-service:3004
  # Rate limiting
  RATE_LIMIT_WINDOW: "10"
  RATE_LIMIT_MAX: "100"
  DDOS_BURST_LIMIT: "500"
  # Circuit breaker
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT: "30"
  # Cache
  L1_CACHE_TTL_SEC: "60"
  L2_CACHE_TTL_SEC: "3600"

services:

  # ── NGINX (TLS Termination + Load Balancer) ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
    depends_on:
      nginx-cert-gen:
        condition: service_completed_successfully
      api-gateway:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 256m }

  # ── TLS Certificate Generator (one-shot) ────────────────────────────────────
  nginx-cert-gen:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - nginx-certs:/certs
    command:
      - |
        if [ ! -f /certs/server.crt ]; then
          openssl req -x509 -nodes -days 365 \
            -subj '/C=US/ST=Dev/L=Dev/O=URLShortener/CN=localhost' \
            -newkey rsa:2048 \
            -keyout /certs/server.key \
            -out /certs/server.crt
          echo 'Self-signed certificate generated'
        else
          echo 'Certificate already exists, skipping'
        fi
    networks:
      - app-net

  # ── API Gateway (3 replicas) ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      <<: *common-env
      API_GATEWAY_PORT: "3000"
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1", memory: 512m }

  # ── URL Service (2 replicas) ─────────────────────────────────────────────────
  url-service:
    build:
      context: .
      dockerfile: services/url-service/Dockerfile
    environment:
      <<: *common-env
      URL_SERVICE_PORT: "3001"
      URL_SERVICE_WORKERS: "2"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 1g }

  # ── Redirect Service (5 replicas — hot path) ─────────────────────────────────
  redirect-service:
    build:
      context: .
      dockerfile: services/redirect-service/Dockerfile
    environment:
      <<: *common-env
      REDIRECT_SERVICE_PORT: "3002"
      REDIRECT_WORKERS: "4"
      REDIRECT_L1_CACHE_MAX: "50000"
      REDIRECT_L1_CACHE_TTL_SEC: "60"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 5
      resources:
        limits: { cpus: "4", memory: 2g }

  # ── Analytics Service (2 replicas) ──────────────────────────────────────────
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      <<: *common-env
      ANALYTICS_SERVICE_PORT: "3003"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 512m }

  # ── Analytics Worker (BullMQ consumer) ──────────────────────────────────────
  analytics-worker:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    command: ["node", "src/workers/analytics.worker.js"]
    environment:
      <<: *common-env
      ANALYTICS_CONCURRENCY: "20"
      ANALYTICS_BATCH_MS: "100"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 512m }

  # ── Auth Service (1 replica) ─────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: *common-env
      AUTH_SERVICE_PORT: "3004"
      JWT_EXPIRES: "24h"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # ══════════════════════════════════════════════════════════════════
  # MONGODB REPLICA SET
  # ══════════════════════════════════════════════════════════════════

  mongo-primary:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    volumes:
      - mongo-primary-data:/data/db
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo-secondary-1:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo-secondary1-data:/data/db
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo-secondary-2:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo-secondary2-data:/data/db
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Replica Set initializer (one-shot)
  mongo-init:
    image: mongo:7
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary-1:
        condition: service_healthy
      mongo-secondary-2:
        condition: service_healthy
    networks:
      - app-net
    command: >
      mongosh --host mongo-primary:27017 --eval "
        try {
          rs.status();
          print('Replica set already initialized');
        } catch(e) {
          rs.initiate({
            _id: 'rs0',
            members: [
              { _id: 0, host: 'mongo-primary:27017',     priority: 2 },
              { _id: 1, host: 'mongo-secondary-1:27017', priority: 1 },
              { _id: 2, host: 'mongo-secondary-2:27017', priority: 1 }
            ]
          });
          print('Replica set initialized');
        }
      "

  # ══════════════════════════════════════════════════════════════════
  # REDIS CLUSTER (3 nodes)
  # ══════════════════════════════════════════════════════════════════

  redis-node-1:
    image: redis:7-alpine
    command: >
      redis-server
        --port 6379
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-node-1-data:/data
    networks:
      app-net:
        ipv4_address: 172.28.1.11
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis-node-2:
    image: redis:7-alpine
    command: >
      redis-server
        --port 6379
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis-node-2-data:/data
    networks:
      app-net:
        ipv4_address: 172.28.1.12
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis-node-3:
    image: redis:7-alpine
    command: >
      redis-server
        --port 6379
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    ports:
      - "6381:6379"
    volumes:
      - redis-node-3-data:/data
    networks:
      app-net:
        ipv4_address: 172.28.1.13
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Redis Cluster initializer (one-shot)
  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    networks:
      - app-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for Redis nodes...'
        sleep 5
        redis-cli --cluster create 172.28.1.11:6379 172.28.1.12:6379 172.28.1.13:6379 --cluster-replicas 0 --cluster-yes
        echo 'Redis Cluster initialized'
    restart: "no"
