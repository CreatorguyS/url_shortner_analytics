worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"upstream":"$upstream_addr",'
            '"correlation_id":"$http_x_correlation_id",'
            '"ip":"$remote_addr"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types application/json text/plain application/javascript;

    # Buffer tuning
    client_body_buffer_size     16k;
    client_header_buffer_size   4k;
    client_max_body_size        2m;
    large_client_header_buffers 4 16k;

    # Rate limiting zones (backup to gateway-level limiting)
    limit_req_zone $binary_remote_addr zone=api:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=redirect:100m rate=2000r/s;

    # Upstream: API Gateway replicas
    upstream api_gateway {
        least_conn;
        server api-gateway:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # API routes — moderate rate limit
        location /api/ {
            limit_req zone=api burst=500 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;

            proxy_next_upstream error timeout http_502 http_503;
        }

        # Auth routes
        location /auth/ {
            limit_req zone=api burst=100 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;

            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # Redirect hot path — highest rate limit
        location ~* "^/([A-Za-z0-9]{6,12})$" {
            limit_req zone=redirect burst=5000 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;

            # Fast timeouts for redirect path
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;

            proxy_next_upstream error timeout http_502 http_503;
        }

        # Health + metrics
        location /health {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /metrics {
            # Restrict metrics to internal only (adjust CIDR as needed)
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://api_gateway;
        }

        # Quickstart endpoint
        location /quickstart {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Everything else (UI + assets)
        location / {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API routes — moderate rate limit
        location /api/ {
            limit_req zone=api burst=500 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;

            proxy_next_upstream error timeout http_502 http_503;
        }

        # Auth routes
        location /auth/ {
            limit_req zone=api burst=100 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # Redirect hot path — highest rate limit
        location ~* "^/([A-Za-z0-9]{6,12})$" {
            limit_req zone=redirect burst=5000 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Fast timeouts for redirect path
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;

            proxy_next_upstream error timeout http_502 http_503;
        }

        # Health + metrics
        location /health {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /metrics {
            # Restrict metrics to internal only (adjust CIDR as needed)
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://api_gateway;
        }

        location / {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
